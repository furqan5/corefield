[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "corefield-ml-lab"
version = "0.1.0.dev0"
description = "CPU-only falsification harness for ML versus classical transformer hot-spot NLS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "pandas>=3,<4",
    "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8"]
field = ["openpyxl>=3.1,<4"]
ml = ["torch>=2.11,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor"]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
    "slow: multi-seed experiment or private field reproduction",
]
