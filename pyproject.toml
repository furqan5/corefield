[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corefield"
version = "0.1.0.dev0"
description = "Transformer winding hot-spot estimation and dynamic loading envelopes from IEC 60076-7 thermal parameter identification"
readme = "README.md"
requires-python = ">=3.11"
# Code is PolyForm Noncommercial 1.0.0 from 2026-09-02. Documentation remains
# CC BY 4.0 -- see LICENSE-docs and NOTICE. Only the code licence is declared
# here, because this field describes the distributed package, which is code.
# Releases before 2026-09-02 were Apache-2.0 and remain so; see NOTICE.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-Apache-2.0-historical"]
keywords = ["transformer", "thermal", "hot-spot", "IEC-60076-7", "power-systems", "dynamic-rating"]
classifiers = [
    # No OSI licence classifier: PolyForm Noncommercial restricts the field of
    # endeavour, so it is source-available rather than open source.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Deliberately minimal and CPU-only. No torch, no GPU, no paid services.
# The production engine is classical nonlinear least squares; see CLAUDE.md
# for why a neural network is not a dependency here.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "matplotlib>=3.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
corefield = "corefield.cli:main"

[tool.setuptools.packages.find]
include = ["corefield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: full multi-seed campaign reproduction; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
